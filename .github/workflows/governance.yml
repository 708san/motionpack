name: governance-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate agent TOML and required governance files
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          base = pathlib.Path(".")
          agents = sorted((base/".codex/agents").glob("*.toml"))
          assert len(agents) == 11, f"expected 11 roles, got {len(agents)}"
          for p in agents:
              with p.open("rb") as f: data = tomllib.load(f)
              assert all(data.get(k) for k in ("name", "description", "developer_instructions")), p
          with (base/".codex/config.toml").open("rb") as f: tomllib.load(f)
          for p in ("README.md", "AGENTS.md", "SECURITY.md", "CONTRIBUTING.md",
                    "docs/DEVELOPMENT_GOVERNANCE_V1.md", "docs/AGENT_ROLES.md",
                    "docs/GITHUB_POLICY.md", "docs/SECURITY_POLICY.md"):
              assert (base/p).is_file(), p
          print("Validated", len(agents), "agent definitions and governance files")
          PY
