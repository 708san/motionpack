name: Isolated archive reader
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-reader:
    name: isolated-reader-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install optional pinned raster decoder
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-image.txt
      - name: Verify isolated raster decoder
        run: python -m unittest discover -s tests -p test_isolated_raster_decoder.py -v
      - name: Verify isolated archive reader
        run: python -m unittest discover -s tests -p test_isolated_archive_reader.py -v
      - name: Verify report-only reader metrics on this OS
        run: python tests/run_performance_report.py --out test-results/performance
