name: Portable headless pose runtime
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-pose:
    name: headless-pose-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check installed runtimes
        run: |
          node --version
          python --version
      - name: Compare portable pose protocol with reference evaluator
        run: node tests/headless_pose_test.js
      - name: Evaluate packaged archives without HTML
        run: python -m unittest tests.test_headless_pose tests.test_pose_session -v
