name: Portable headless pose runtime
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-pose:
    name: headless-pose-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check installed runtimes
        run: |
          node --version
          python --version
          cargo --version
          rustc --version
      - name: Verify dependency-free Rust core natively
        run: |
          cargo test --manifest-path core/Cargo.toml --locked
          cargo build --manifest-path core/Cargo.toml --locked --bin motionpack_core_probe
          node tests/rust_core_parity_test.js native
          node tests/rust_timeline_parity_test.js
      - name: Install stable Rust WebAssembly target (Linux)
        if: runner.os == 'Linux'
        run: rustup target add wasm32-unknown-unknown
      - name: Verify Rust WebAssembly against reference evaluator (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --manifest-path core/Cargo.toml --locked --release --lib --target wasm32-unknown-unknown
          node tests/rust_core_parity_test.js wasm
      - name: Compare portable pose protocol with reference evaluator
        run: node tests/headless_pose_test.js
      - name: Evaluate packaged archives without HTML
        run: python -m unittest tests.test_headless_pose tests.test_pose_session tests.test_headless_behavior tests.test_headless_motion_director -v
