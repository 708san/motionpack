name: Isolated raster decoder
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-raster:
    name: isolated-raster-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install optional pinned decoder
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-image.txt
      - name: Test isolated raster decoder
        run: python -m unittest discover -s tests -p test_isolated_raster_decoder.py -v
      - name: Test isolated archive-reader process helpers
        run: python -m unittest discover -s tests -p test_isolated_archive_reader.py -v
